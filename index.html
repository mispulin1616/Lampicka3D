<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lampička 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;overflow:hidden;font-family:-apple-system,sans-serif}
canvas{display:block}
#ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
.btn{padding:9px 22px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(20,20,40,.7);color:#dde;cursor:pointer;font-size:13px;backdrop-filter:blur(12px);transition:all .2s;letter-spacing:.02em}
.btn:hover{background:rgba(80,80,140,.5);border-color:rgba(255,255,255,.35)}
#info{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:rgba(200,210,255,.45);font-size:12.5px;letter-spacing:.04em;text-align:center;pointer-events:none}
#label{position:fixed;top:20px;right:24px;color:rgba(200,210,255,.3);font-size:11px;text-align:right;pointer-events:none;line-height:1.8}
</style>
</head>
<body>
<div id="info">🖱 Levé tlač. — otáčet &nbsp;·&nbsp; Kolečko — zoom &nbsp;·&nbsp; Pravé tlač. — posun</div>
<div id="label">Three.js · WebGL<br>Anglepoise Lamp</div>
<div id="ui">
  <button class="btn" id="lightBtn" onclick="toggleLight()">💡 Vypnout světlo</button>
  <button class="btn" onclick="resetCam()">🎯 Reset pohledu</button>
  <button class="btn" onclick="downloadSTL()">📥 Stáhnout STL</button>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
}}</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080f);
scene.fog = new THREE.FogExp2(0x08080f, 0.032);

const lampGrp = new THREE.Group();
scene.add(lampGrp);

// ── Camera ────────────────────────────────────────────────────────────────────
const cam = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 80);
cam.position.set(5, 5.5, 7);

const ctrl = new OrbitControls(cam, renderer.domElement);
ctrl.target.set(0.3, 1.8, 0);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.06;
ctrl.maxPolarAngle = Math.PI * 0.47;
ctrl.minDistance = 2.5;
ctrl.maxDistance = 18;
ctrl.update();

// ── Lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a1a35, 0.4));

const rimL = new THREE.DirectionalLight(0x3355aa, 0.35);
rimL.position.set(-6, 9, -6);
scene.add(rimL);

// Lamp lights (positioned at bulb — updated after geometry)
const bulbPt  = new THREE.PointLight(0xffb347, 10, 7, 1.8);
const fillPt  = new THREE.PointLight(0xffcc66,  4, 12, 1.5);
const spotL   = new THREE.SpotLight(0xffb347, 18, 9, Math.PI/5.5, 0.45, 1.8);
spotL.castShadow = true;
spotL.shadow.mapSize.set(2048, 2048);
spotL.shadow.camera.near = 0.3;
spotL.shadow.camera.far  = 10;
[bulbPt, fillPt, spotL].forEach(l => scene.add(l));

// ── Materials ─────────────────────────────────────────────────────────────────
const chrome = new THREE.MeshStandardMaterial({ color:0xc0ced8, metalness:.95, roughness:.08 });
const brushed= new THREE.MeshStandardMaterial({ color:0x909aa8, metalness:.85, roughness:.35 });
const dark   = new THREE.MeshStandardMaterial({ color:0x222228, metalness:.8,  roughness:.4  });
const rubber = new THREE.MeshStandardMaterial({ color:0x111116, metalness:0,   roughness:.95 });
const shadeW = new THREE.MeshStandardMaterial({ color:0xf4ede0, metalness:.04, roughness:.55, side:THREE.FrontSide });
const shadeI = new THREE.MeshStandardMaterial({ color:0xffe9a0, metalness:.6,  roughness:.25,
                  emissive:new THREE.Color(0xffcc44), emissiveIntensity:.45, side:THREE.BackSide });
const bulbM  = new THREE.MeshStandardMaterial({ color:0xfff5d0, metalness:0, roughness:1,
                  emissive:new THREE.Color(0xffdd66), emissiveIntensity:5 });
const woodM  = new THREE.MeshStandardMaterial({ color:0x4a2f14, metalness:0, roughness:.85 });
const woodDk = new THREE.MeshStandardMaterial({ color:0x3a2208, metalness:0, roughness:.9  });

// ── Helpers ───────────────────────────────────────────────────────────────────
const UP = new THREE.Vector3(0,1,0);
function addMesh(geo, mat, { pos=[0,0,0], rot=[0,0,0], cast=true, recv=true } = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = cast; m.receiveShadow = recv;
  lampGrp.add(m); return m;
}
// Cylinder spanning two Vector3 points
function cylinder(a, b, rTop, rBot, mat, segs=20) {
  const dir = b.clone().sub(a);
  const len = dir.length();
  const mid = a.clone().add(b).multiplyScalar(.5);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, len, segs), mat);
  m.position.copy(mid);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  m.castShadow = true; m.receiveShadow = true;
  lampGrp.add(m); return m;
}
function sphere(r, pos, mat, segs=32) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, segs, segs), mat);
  m.position.set(...pos); m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
function torus(r, tube, pos, rotX=Math.PI/2, mat=chrome) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 14, 64), mat);
  m.position.set(...pos); m.rotation.x = rotX;
  m.castShadow = true; lampGrp.add(m); return m;
}

// ── KEY POSITIONS ─────────────────────────────────────────────────────────────
const P = {
  baseTop:    new THREE.Vector3(0,      0.13,  0),
  pivot:      new THREE.Vector3(0,      0.28,  0),
  elbow:      new THREE.Vector3(-0.08,  2.35,  0.08),
  head:       new THREE.Vector3(0.55,   3.72, -0.10),
  neckEnd:    new THREE.Vector3(0.78,   3.38, -0.06),
  bulb:       new THREE.Vector3(0.81,   3.10, -0.06),
};

// ── BASE ──────────────────────────────────────────────────────────────────────
// Main base disc (slightly domed)
addMesh(new THREE.CylinderGeometry(.70, .78, .10, 64), chrome, {pos:[0,.05,0]});
addMesh(new THREE.CylinderGeometry(.72, .72, .02, 64), brushed,{pos:[0,.10,0]});
torus(.76, .025, [0,.03,0], Math.PI/2, dark);
torus(.58, .015, [0,.11,0], Math.PI/2, dark);

// Rubber feet
for(let i=0;i<4;i++){
  const a = (i/4)*Math.PI*2 + Math.PI/4;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(.04,.045,.012,16), rubber);
  m.position.set(Math.cos(a)*.62, .006, Math.sin(a)*.62);
  lampGrp.add(m);
}

// Base post + pivot housing
cylinder(P.baseTop, P.pivot, .055, .07, brushed, 16);
sphere(.08, [P.pivot.x, P.pivot.y, P.pivot.z], dark, 24);
torus(.10, .018, [P.pivot.x, P.pivot.y, P.pivot.z], Math.PI/2, chrome);

// Power switch on base
const sw = new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,.025,16), dark);
sw.position.set(.55,.115,.35); sw.rotation.x = Math.PI/2; lampGrp.add(sw);
const swBtn = new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.008,16), chrome);
swBtn.position.set(.55,.115,.36); swBtn.rotation.x = Math.PI/2; lampGrp.add(swBtn);

// ── LOWER ARM ─────────────────────────────────────────────────────────────────
cylinder(P.pivot, P.elbow, .026, .030, chrome);

// Double spring detail (two thin rods offset slightly)
const lDir = P.elbow.clone().sub(P.pivot).normalize();
const lPerp = new THREE.Vector3(lDir.y, -lDir.x, 0).normalize().multiplyScalar(.022);
cylinder(P.pivot.clone().add(lPerp), P.elbow.clone().add(lPerp), .008, .008, dark, 8);
cylinder(P.pivot.clone().sub(lPerp), P.elbow.clone().sub(lPerp), .008, .008, dark, 8);

// Coil rings on lower arm
for(let i=1;i<=10;i++){
  const t = i/11;
  const pos = P.pivot.clone().lerp(P.elbow, t);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.034,.007,8,20), dark);
  ring.position.copy(pos);
  ring.quaternion.setFromUnitVectors(UP, P.elbow.clone().sub(P.pivot).normalize());
  ring.castShadow = true; lampGrp.add(ring);
}

// ── ELBOW JOINT ───────────────────────────────────────────────────────────────
sphere(.075, [P.elbow.x, P.elbow.y, P.elbow.z], dark);
const elbowColDir = P.head.clone().sub(P.elbow).normalize();
const elbowCol = new THREE.Mesh(new THREE.CylinderGeometry(.095,.095,.065,32), chrome);
elbowCol.position.copy(P.elbow);
elbowCol.quaternion.setFromUnitVectors(UP, elbowColDir);
lampGrp.add(elbowCol);

// ── UPPER ARM ─────────────────────────────────────────────────────────────────
cylinder(P.elbow, P.head, .023, .027, chrome);

// Coil rings on upper arm
for(let i=1;i<=8;i++){
  const t = i/9;
  const pos = P.elbow.clone().lerp(P.head, t);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.030,.006,8,20), dark);
  ring.position.copy(pos);
  ring.quaternion.setFromUnitVectors(UP, P.head.clone().sub(P.elbow).normalize());
  ring.castShadow = true; lampGrp.add(ring);
}

// ── HEAD JOINT ────────────────────────────────────────────────────────────────
sphere(.068, [P.head.x, P.head.y, P.head.z], dark);
const headColDir = P.neckEnd.clone().sub(P.head).normalize();
const headCol = new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,.055,32), chrome);
headCol.position.copy(P.head);
headCol.quaternion.setFromUnitVectors(UP, headColDir);
lampGrp.add(headCol);

// ── NECK ──────────────────────────────────────────────────────────────────────
cylinder(P.head, P.neckEnd, .019, .022, chrome);

// ── SHADE ─────────────────────────────────────────────────────────────────────
const shadeGrp = new THREE.Group();
shadeGrp.position.copy(P.neckEnd);
// Tilt shade downward
shadeGrp.rotation.z =  Math.PI * .14;
shadeGrp.rotation.x = -Math.PI * .04;
lampGrp.add(shadeGrp);

// Outer cone
const shadeOut = new THREE.Mesh(new THREE.CylinderGeometry(.48,.13,.60,64,1,true), shadeW);
shadeOut.position.y = -.16; shadeOut.castShadow = true; shadeOut.receiveShadow = true;
shadeGrp.add(shadeOut);

// Inner (gold/emissive)
const shadeIn = new THREE.Mesh(new THREE.CylinderGeometry(.47,.12,.59,64,1,true), shadeI);
shadeIn.position.y = -.16;
shadeGrp.add(shadeIn);

// Top cap
const topCap = new THREE.Mesh(new THREE.CircleGeometry(.13,32), shadeW);
topCap.rotation.x = -Math.PI/2; topCap.position.y = .14;
shadeGrp.add(topCap);

// Bottom rim ring
const rimRing = new THREE.Mesh(new THREE.TorusGeometry(.48,.013,10,64), chrome);
rimRing.rotation.x = Math.PI/2; rimRing.position.y = -.44;
rimRing.castShadow = true; shadeGrp.add(rimRing);

// Top finial knob
const knob = new THREE.Mesh(new THREE.SphereGeometry(.038,16,16), dark);
knob.position.y = .17; shadeGrp.add(knob);

// Neck entry collar
const neckCollar = new THREE.Mesh(new THREE.CylinderGeometry(.058,.058,.04,24), chrome);
neckCollar.position.y = .12; shadeGrp.add(neckCollar);

// ── BULB ─────────────────────────────────────────────────────────────────────
const bulbGrp = new THREE.Group();
bulbGrp.position.y = .06;
shadeGrp.add(bulbGrp);

const bulbGlobe = new THREE.Mesh(new THREE.SphereGeometry(.075,32,32), bulbM);
bulbGlobe.castShadow = false; bulbGrp.add(bulbGlobe);

const bulbBase2 = new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.09,20), dark);
bulbBase2.position.y = .08; bulbGrp.add(bulbBase2);

// ── POSITION LIGHTS AT BULB ───────────────────────────────────────────────────
// Approximate world position of bulb (shade tilted ~25°)
const bx = P.neckEnd.x + .07;
const by = P.neckEnd.y - .22;
const bz = P.neckEnd.z;

bulbPt.position.set(bx, by, bz);
fillPt.position.set(bx, by+.3, bz);
spotL.position.set(bx, by, bz);
const tgt = new THREE.Object3D();
tgt.position.set(bx+.5, 0, bz+.2);
scene.add(tgt); spotL.target = tgt;

// ── CABLE ─────────────────────────────────────────────────────────────────────
// Runs down the lamp arm to the desk
const cPts = [
  new THREE.Vector3(.0, .25, .0),
  new THREE.Vector3(-.04, .9, .04),
  new THREE.Vector3(-.07, 1.6, .07),
  new THREE.Vector3(-.05, 2.35, .09),   // elbow
  new THREE.Vector3(.12, 2.8, .02),
  new THREE.Vector3(.3, 3.4, -.04),     // near head
  new THREE.Vector3(.38, 3.42, -.04),
];
// Trail on desk
const trailPts = [
  new THREE.Vector3(.0, .0, .0),
  new THREE.Vector3(.3, .0, .4),
  new THREE.Vector3(.8, .0, 1.1),
  new THREE.Vector3(1.8, .0, 1.8),
  new THREE.Vector3(3.5, .0, 2.5),
];
[cPts, trailPts].forEach(pts => {
  const crv = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(crv, 40, .012, 6, false);
  const m = new THREE.Mesh(geo, rubber); m.castShadow = true; lampGrp.add(m);
});

// ── DESK ──────────────────────────────────────────────────────────────────────
// Main surface
const desk = new THREE.Mesh(new THREE.BoxGeometry(10, .10, 6), woodM);
desk.position.set(.5, -.05, 1.5); desk.receiveShadow = true; scene.add(desk);

// Wood grain stripes (thin dark boxes)
for(let i=0;i<12;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(10,.001,.02), woodDk);
  s.position.set(.5, 0, -1 + i*.5); scene.add(s);
}
// Front edge strip
const edgeF = new THREE.Mesh(new THREE.BoxGeometry(10,.10,.04), woodDk);
edgeF.position.set(.5,-.05, 4.5); edgeF.receiveShadow=true; scene.add(edgeF);

// Left side panel (wall behind desk)
const wall = new THREE.Mesh(new THREE.BoxGeometry(10,.001,6),
  new THREE.MeshStandardMaterial({color:0x0e0e1a,metalness:0,roughness:1}));
wall.position.set(.5, 5, -1.5); wall.rotation.x = Math.PI/2; scene.add(wall);

// Light pool on desk
const poolGeo = new THREE.PlaneGeometry(1.6, 1.6, 1, 1);
const poolMat = new THREE.MeshBasicMaterial({
  color:0xffee88, transparent:true, opacity:.07, depthWrite:false
});
const pool = new THREE.Mesh(poolGeo, poolMat);
pool.rotation.x = -Math.PI/2;
pool.position.set(bx+.6, .01, bz+.4);
scene.add(pool);

// ── DESK OBJECTS ──────────────────────────────────────────────────────────────
// Book stack
const bookColors = [0x7a1515, 0x15357a, 0x1a5c1a, 0x4a3a0a];
let bY = 0;
bookColors.forEach((c,i) => {
  const h = .065 + Math.random()*.03;
  const bk = new THREE.Mesh(new THREE.BoxGeometry(.62-.02*i,.065+h*.5,.82-.02*i),
    new THREE.MeshStandardMaterial({color:c,roughness:.85}));
  bk.position.set(-2.2, h*.5+bY, 1.8); bk.rotation.y = (Math.random()-.5)*.15;
  bk.castShadow=true; bk.receiveShadow=true; scene.add(bk);
  bY += h*.5+.065;
});

// Notebook
const nb = new THREE.Mesh(new THREE.BoxGeometry(.55,.025,.70),
  new THREE.MeshStandardMaterial({color:0xf0ede5,roughness:.7}));
nb.position.set(1.4,.013,1.2); nb.rotation.y=-.08; nb.castShadow=true; nb.receiveShadow=true; scene.add(nb);
// Notebook lines
for(let i=0;i<7;i++){
  const l=new THREE.Mesh(new THREE.BoxGeometry(.42,.001,.004),
    new THREE.MeshStandardMaterial({color:0xaac0dd}));
  l.position.set(1.4,.026,1-.05+i*.06); l.rotation.y=-.08; scene.add(l);
}
// Pen
const pen = new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,.22,12),
  new THREE.MeshStandardMaterial({color:0x111111,metalness:.5,roughness:.3}));
pen.position.set(1.75,.022,1.3); pen.rotation.z=Math.PI/2+.3; pen.castShadow=true; scene.add(pen);
const penTip = new THREE.Mesh(new THREE.ConeGeometry(.007,.025,8),
  new THREE.MeshStandardMaterial({color:0xcccccc,metalness:.8}));
penTip.position.set(1.64,.022,1.35); penTip.rotation.z=-Math.PI/2+.3; scene.add(penTip);

// Coffee mug
const mugMat = new THREE.MeshStandardMaterial({color:0xe8e0d5,roughness:.4,metalness:.02});
const mug = new THREE.Mesh(new THREE.CylinderGeometry(.09,.082,.195,32), mugMat);
mug.position.set(2.2,.098,2.3); mug.castShadow=true; mug.receiveShadow=true; scene.add(mug);
const mugTop = new THREE.Mesh(new THREE.CircleGeometry(.09,32),
  new THREE.MeshStandardMaterial({color:0x3a200a}));
mugTop.rotation.x=-Math.PI/2; mugTop.position.set(2.2,.198,2.3); scene.add(mugTop);
const handle = new THREE.Mesh(new THREE.TorusGeometry(.067,.013,8,20,Math.PI), mugMat);
handle.position.set(2.295,.098,2.3); handle.rotation.y=Math.PI/2; scene.add(handle);

// Small plant pot
const pot = new THREE.Mesh(new THREE.CylinderGeometry(.08,.065,.12,20),
  new THREE.MeshStandardMaterial({color:0x8b5e3c,roughness:.9}));
pot.position.set(-1.5,.06,2.8); pot.castShadow=true; pot.receiveShadow=true; scene.add(pot);
const soil = new THREE.Mesh(new THREE.CircleGeometry(.08,20),
  new THREE.MeshStandardMaterial({color:0x2a1a0a}));
soil.rotation.x=-Math.PI/2; soil.position.set(-1.5,.121,2.8); scene.add(soil);
// Cactus (simple)
const cactus = new THREE.Mesh(new THREE.CylinderGeometry(.04,.045,.25,10),
  new THREE.MeshStandardMaterial({color:0x2d5a27,roughness:.9}));
cactus.position.set(-1.5,.245,2.8); cactus.castShadow=true; scene.add(cactus);
const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(.025,.028,.14,10),
  new THREE.MeshStandardMaterial({color:0x2d5a27,roughness:.9}));
arm1.position.set(-1.44,.29,2.8); arm1.rotation.z=Math.PI/3.5; arm1.castShadow=true; scene.add(arm1);

// ── RESIZE ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  cam.aspect = innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── TOGGLE ────────────────────────────────────────────────────────────────────
let lightOn = true;
window.toggleLight = () => {
  lightOn = !lightOn;
  bulbPt.intensity   = lightOn ? 10  : 0;
  fillPt.intensity   = lightOn ? 4   : 0;
  spotL.intensity    = lightOn ? 18  : 0;
  bulbM.emissiveIntensity = lightOn ? 5 : 0.05;
  shadeI.emissiveIntensity = lightOn ? .45 : 0;
  poolMat.opacity    = lightOn ? .07 : 0;
  document.getElementById('lightBtn').textContent = lightOn ? '💡 Vypnout světlo' : '💡 Zapnout světlo';
};
window.downloadSTL = () => {
  const exporter = new STLExporter();
  const data = exporter.parse(lampGrp, { binary: true });
  const blob = new Blob([data], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lampicka.stl';
  a.click();
  URL.revokeObjectURL(a.href);
};
window.resetCam = () => {
  cam.position.set(5,5.5,7);
  ctrl.target.set(.3,1.8,0);
  ctrl.update();
};

// ── ANIMATE ───────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  // Subtle bulb flicker
  if (lightOn) {
    const t = Date.now() * .001;
    bulbPt.intensity = 10 + Math.sin(t * 17) * .3 + Math.sin(t * 31) * .15;
  }
  ctrl.update();
  renderer.render(scene, cam);
}
animate();
</script>
</body>
</html>
